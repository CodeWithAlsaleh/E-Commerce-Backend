# ===================================================================
# Test Profile Configuration
# ===================================================================
# This file provides dummy/in-memory values so that @SpringBootTest
# can load the full application context without real environment variables.
# ===================================================================

### Use an in-memory H2 database instead of a real database ###
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

### Let Hibernate auto-create tables from entities ###
spring.jpa.hibernate.ddl-auto=create-drop

### JWT dummy values (satisfies @Value injection in JwtUtil) ###
jwt.secret=dGhpcyBpcyBhIHRlc3Qgc2VjcmV0IGtleSBmb3IgdGVzdGluZyBvbmx5IGRvIG5vdCB1c2UgaW4gcHJvZHVjdGlvbiE=
jwt.access-token-expiration-ms=3600000
jwt.refresh-token-expiration-ms=86400000

### DatabaseSeeder dummy values (satisfies @Value injection in DatabaseSeeder) ###
SERVER_ADMIN_FIRST_NAME=TestAdmin
SERVER_ADMIN_LAST_NAME=User
SERVER_ADMIN_EMAIL=admin@test.com
SERVER_ADMIN_LOCATION=TestCity
SERVER_ADMIN_PASSWORD=testpassword123
